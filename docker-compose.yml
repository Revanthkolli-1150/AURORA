version: '3.8'

services:
  # ==============================================================================
  # Primary Relational Database
  # ==============================================================================
  aurora-postgres:
    image: postgres:16-alpine
    container_name: aurora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aurora}
      POSTGRES_USER: ${DB_USERNAME:-aurora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - aurora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-aurora} -d ${DB_NAME:-aurora}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aurora-network

  # ==============================================================================
  # AURORA Control Plane (Modular Monolith v0.1)
  # ==============================================================================
  aurora-control-plane:
    build:
      context: ./platform/aurora-control-plane
      dockerfile: Dockerfile
    container_name: aurora-control-plane
    restart: unless-stopped
    depends_on:
      aurora-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: aurora-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aurora}
      DB_USERNAME: ${DB_USERNAME:-aurora}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
      AURORA_ENV: ${AURORA_ENV:-development}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - aurora-network

networks:
  aurora-network:
    driver: bridge

volumes:
  aurora_postgres_data:
    driver: local
