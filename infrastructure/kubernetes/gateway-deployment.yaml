apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-gateway
  namespace: aurora-system
  labels:
    app: aurora-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aurora-gateway
  template:
    metadata:
      labels:
        app: aurora-gateway
    spec:
      containers:
        - name: gateway
          image: aurora/gateway:0.1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aurora-gateway-svc
  namespace: aurora-system
spec:
  selector:
    app: aurora-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
