global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aurora-otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'aurora-gateway'
    static_configs:
      - targets: ['gateway:8080']

  - job_name: 'aurora-telemetry-service'
    static_configs:
      - targets: ['telemetry-service:8083']
