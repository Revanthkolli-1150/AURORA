server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: aurora-control-plane

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aurora}
    username: ${DB_USERNAME:aurora}
    password: ${DB_PASSWORD:aurora}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AuroraHikariCP
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

aurora:
  control-plane:
    version: 0.1.0
    environment: ${AURORA_ENV:development}
